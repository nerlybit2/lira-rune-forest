<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lira: Rune Forest</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lira">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#cfeedd">
<link rel="apple-touch-icon" href="art/icon-180.png">
<link rel="icon" href="art/icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  /* Layout: one phone-shaped stage; map scrolls through worlds, level screen is HUD + square board + booster bar */
  --night:#0c1d17; --moss:#2f8a57; --gold:#ffd166; --gold-deep:#d99a2b;
  --parch:#fdf6e3; --parch-2:#eadbb8; --ink:#1f2a24; --muted:#6c7a70; --rose:#e05597; --sky:#8fd3ff;
  --display:'Baloo 2','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#cfeedd;color:var(--parch);font-family:var(--body);overflow:hidden}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:#cfeedd;user-select:none;-webkit-user-select:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* ---------- map ---------- */
/* Saga map: worlds stack bottom-to-top, a trail joins the levels, Lira stands on the current one */
#map{background:#cfeedd}
.topbar{position:relative;z-index:3;display:flex;gap:6px;align-items:center;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:rgba(255,250,236,.95);color:var(--ink);box-shadow:0 3px 12px rgba(60,90,70,.25)}
.stat{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(31,42,36,.12);background:rgba(31,42,36,.06);color:var(--ink);border-radius:999px;padding:5px 10px;font:700 13px var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .ico{font-size:14px}
.stat small{color:var(--muted);font-weight:600}
.topbar .grow{flex:1}
button.stat{background:var(--gold);color:var(--ink);border-color:transparent;box-shadow:0 3px 0 var(--gold-deep)}
.me{display:flex;align-items:center;gap:8px;min-width:0}
.me .avatar{width:40px;height:40px;flex:none;border-radius:50%;border:2px solid var(--gold);overflow:hidden;background:#2a6b4c}
.me b{display:block;font:800 16px/1 var(--display)}
.xp{display:flex;align-items:center;gap:5px;margin-top:3px;font:800 11px var(--body);color:var(--muted)}
.xp i{position:relative;display:block;width:46px;height:6px;border-radius:3px;background:rgba(31,42,36,.12);overflow:hidden}
.xp i b{position:absolute;inset:0 auto 0 0;background:var(--gold)}
#mapScroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.mworld{position:relative;background:var(--wbg);overflow:hidden}
.mworld>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mworld .blend{position:absolute;left:0;right:0;top:0;height:90px;background:linear-gradient(var(--above),transparent);pointer-events:none}
.wtitle{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);text-align:center;white-space:nowrap;padding:7px 18px;border-radius:16px;background:rgba(255,250,236,.92);color:var(--ink);border:2px solid #fff;box-shadow:0 4px 12px rgba(60,90,70,.25)}
.wtitle span{display:block;font:800 10px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep)}
.wtitle b{font:800 21px/1.1 var(--display)}
.soon .wtitle{bottom:auto;top:50%;transform:translate(-50%,-50%)}
.soon .wtitle p{margin:2px 0 0;font-size:13px;color:var(--muted);white-space:normal}
.mnode{position:absolute;z-index:1;transform:translate(-50%,50%);display:flex;flex-direction:column;align-items:center}
.node{display:grid;place-items:center;padding:0;width:58px;height:58px;border-radius:50%;border:3px solid rgba(255,255,255,.75);font:800 22px var(--display);color:var(--ink);background:radial-gradient(circle at 40% 35%,#fff3c4,var(--gold) 60%,var(--gold-deep));box-shadow:0 5px 0 #8a5c12,0 6px 14px rgba(0,0,0,.35)}
.node:active:not(:disabled){transform:translateY(3px)}
.node.done{background:radial-gradient(circle at 40% 35%,#d7ffe4,#6fd39a 60%,#2f8a57);box-shadow:0 5px 0 #1d5a39,0 6px 14px rgba(0,0,0,.35)}
.node:disabled{background:#4a5651;color:#c3ccc7;border-color:rgba(255,255,255,.25);box-shadow:0 5px 0 #2a332f;cursor:not-allowed}
.node:disabled svg{width:22px;height:22px}
.node.gate{border-radius:24px 24px 12px 12px}
.node.current{width:76px;height:76px;font-size:28px;animation:pulse 1.4s ease-in-out infinite}
.play-tab{margin-top:7px;padding:3px 12px;border-radius:999px;background:var(--rose);color:#fff;font:800 12px var(--body);letter-spacing:.12em;box-shadow:0 3px 0 #a83a6d}
.arc{position:absolute;top:-17px;left:50%;transform:translateX(-50%);display:flex;font-size:17px;line-height:1;color:var(--gold);text-shadow:0 1px 2px rgba(0,0,0,.7)}
.arc span:first-child{transform:translateY(6px) rotate(-20deg)}
.arc span:last-child{transform:translateY(6px) rotate(20deg)}
.arc .off{color:rgba(255,255,255,.35)}
.lira-pin{position:absolute;z-index:2;width:64px;height:92px;margin-left:-32px;pointer-events:none}
.lira-pin img{display:block;width:100%;height:100%;object-fit:contain;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
.sign{position:absolute;transform:translate(-50%,50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.sign div{background:#8a6038;border:2px solid #5a3d22;border-radius:9px;padding:4px 10px;text-align:center;box-shadow:0 3px 0 #4a3019}
.sign span{display:block;font:800 9px var(--body);letter-spacing:.12em;text-transform:uppercase;color:#ffe2a8}
.sign b{font:800 14px/1.1 var(--display);color:#fff6e0;white-space:nowrap}
.sign i{width:5px;height:20px;background:#5a3d22;border-radius:2px}
.daily-float{position:absolute;z-index:3;left:max(12px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));border:0;border-radius:16px;padding:10px 14px;font:800 14px var(--body);background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-deep),0 6px 16px rgba(0,0,0,.45)}
.daily-float:disabled{background:#4a5651;color:#c3ccc7;box-shadow:0 4px 0 #2a332f;cursor:default}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 5px 0 #8a5c12,0 0 0 10px rgba(255,209,102,.25)}}
@keyframes bob{50%{transform:translateY(-5px)}}

/* ---------- level ---------- */
#game{background:var(--gbg)}
.hud{display:flex;align-items:stretch;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) 4px max(12px,env(safe-area-inset-left,0px))}
.hud-left{display:flex;flex-direction:column;gap:6px}
.stat.gear{font-size:16px;padding:4px 9px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(31,42,36,.1);text-align:left;font:800 16px var(--body);color:var(--ink)}
.toggle-row small{display:block;font:600 12px var(--body);color:var(--muted)}
.switch{flex:none;width:54px;height:32px;border-radius:999px;border:0;background:#c9cfcb;position:relative;cursor:pointer;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--moss)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.icon-btn{width:46px;height:34px;border-radius:12px;border:2px solid #fff;background:rgba(255,250,236,.92);color:var(--ink);box-shadow:0 3px 8px rgba(60,90,70,.25);font:800 14px var(--body)}
.hud-panel{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:rgba(255,250,236,.92);color:var(--ink);border:2px solid #fff;border-radius:18px;padding:6px 10px;box-shadow:0 4px 12px rgba(60,90,70,.25)}
.moves{display:flex;flex-direction:column;align-items:center;line-height:1;min-width:58px;padding-right:10px;border-right:1px solid rgba(31,42,36,.12)}
.moves b{font:800 40px/1 var(--display);font-variant-numeric:tabular-nums}
.moves span{font:800 10px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.moves.low b{color:#e0483a}
.goal-row{flex:1;min-width:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.goal{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid rgba(31,42,36,.1);border-radius:14px;padding:3px 10px 3px 3px;font:800 20px var(--display);font-variant-numeric:tabular-nums}
.goal canvas{width:36px;height:36px}
.goal.ok{border-color:#6fd39a;color:var(--moss)}
.goal.hit{animation:hit .25s}
.board-wrap{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bottom{position:relative;display:flex;align-items:flex-end;gap:6px;padding:4px max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.lira-corner{position:relative;flex:none}
.lira-corner .avatar{width:58px;height:58px;border-radius:50%;border:3px solid var(--gold);overflow:hidden;background:#2a6b4c}
.avatar svg,.avatar img{display:block;width:100%;height:100%;object-fit:cover}
.lira-corner .avatar img{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.04) translateY(-1px)}}
.speech{position:absolute;left:0;bottom:calc(100% + 12px);z-index:4;width:max-content;max-width:min(300px,80vw);margin:0;background:var(--parch);color:var(--ink);border-radius:14px;padding:8px 12px;font:700 14px/1.35 var(--body);box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none}
.speech.on{opacity:1;transform:none}
.speech::after{content:"";position:absolute;left:22px;top:100%;border:7px solid transparent;border-top-color:var(--parch)}
.boosters{flex:1;display:flex;justify-content:space-around;gap:2px}
.spell{display:flex;flex-direction:column;align-items:center;gap:2px;width:66px;background:none;border:0;padding:0;color:var(--ink);font:800 11px/1.1 var(--body);text-align:center;text-shadow:0 0 4px #fff,0 0 2px #fff}
.spell .orb{position:relative;width:54px;height:54px;border-radius:50%;padding:6px;background:conic-gradient(var(--col) calc(var(--p)*1%),rgba(255,255,255,.75) 0);box-shadow:0 3px 8px rgba(60,90,70,.3)}
.spell .orb i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#fff8e6}
.spell canvas{width:28px;height:28px}
.spell .cnt{font:800 11px var(--body);color:var(--ink);font-variant-numeric:tabular-nums}
.spell .n{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-size:12px}
.spell.ready{color:var(--gold)}
.spell.ready .orb{box-shadow:0 0 16px rgba(255,209,102,.8);animation:glow 1.2s ease-in-out infinite}
.spell.active .orb i{background:var(--gold)}
.spell.burst .orb::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:4px solid var(--gold);animation:ring .8s ease-out forwards}
@keyframes glow{50%{box-shadow:0 0 4px rgba(255,209,102,.3)}}
@keyframes ring{to{transform:scale(1.9);opacity:0}}
@keyframes hit{50%{transform:scale(1.18)}}
.flyer{position:absolute;z-index:6;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;pointer-events:none;box-shadow:0 0 10px rgba(255,255,255,.75)}

/* ---------- modal + shop ---------- */
.modal{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:rgba(30,60,80,.42);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:360px;max-height:100%;overflow-y:auto;background:var(--parch);color:var(--ink);border-radius:24px;padding:22px 18px 16px;display:flex;flex-direction:column;gap:10px;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.card h2{margin:0;font:800 30px/1.05 var(--display);text-wrap:balance}
.card .eyebrow{margin:0;font:800 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--moss)}
.card p.muted{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
.card .avatar{width:96px;height:96px;margin:0 auto;border-radius:50%;border:3px solid var(--gold);overflow:hidden;background:#2a6b4c}
.btn{width:100%;border:0;border-radius:16px;padding:13px 16px;font:800 18px var(--display);background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--gold-deep)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--gold-deep)}
.btn.green{background:#6fd39a;box-shadow:0 5px 0 #2f8a57}
.btn.plain{background:#fff;box-shadow:0 5px 0 var(--parch-2);border:2px solid var(--parch-2)}
.btn.ghost{background:none;box-shadow:none;color:var(--muted);padding:6px;font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
.wallet{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px auto 12px;padding:6px 6px 6px 14px;border-radius:999px;background:#fff4d6;border:2px solid var(--gold);width:max-content;max-width:100%;font:800 15px var(--body);color:var(--ink)}
.wallet .coin{display:inline-block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff1b0,var(--gold) 55%,var(--gold-deep));box-shadow:inset 0 -1px 0 rgba(0,0,0,.2);vertical-align:-3px;margin-right:4px}
.wallet button{border:0;border-radius:999px;padding:6px 12px;background:var(--gold);color:var(--ink);font:800 13px var(--body);cursor:pointer}
.ad-tag{font:800 11px var(--body);letter-spacing:.06em;background:var(--ink);color:var(--gold);border-radius:6px;padding:2px 7px;margin-right:6px;vertical-align:3px}
.feat{display:grid;gap:6px;text-align:left;background:#fff;border:2px solid var(--parch-2);border-radius:18px;padding:12px}
.feat .new{justify-self:start;background:var(--rose);color:#fff;font:800 11px var(--body);letter-spacing:.1em;text-transform:uppercase;padding:2px 9px;border-radius:999px}
.feat canvas{width:100%;height:auto;aspect-ratio:300/110;border-radius:12px;background:#1d4a37}
.feat h3{margin:0;font:800 21px/1.1 var(--display)}
.feat ol{margin:0;padding-left:20px;font-size:14.5px;line-height:1.45;display:grid;gap:4px}
.label{margin:4px 0 0;font:800 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left}
.goal-rows{display:grid;gap:6px;text-align:left}
.goal-rows div{display:flex;align-items:center;gap:10px;font:700 15px/1.3 var(--body)}
.goal-rows canvas{width:30px;height:30px;flex:none}
.hud-left{display:flex;gap:6px}
.goal-list{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.goal-list .goal{background:#fff;border-color:var(--parch-2);color:var(--ink)}
.big-stars{font-size:48px;line-height:1;letter-spacing:6px;color:var(--gold-deep)}
.big-stars span{display:inline-block;animation:starIn .5s backwards}
.big-stars .off{color:#dccfb0}
.rewards{display:flex;justify-content:center;gap:16px;font:800 16px var(--body)}
.ad-box{height:150px;border-radius:16px;display:grid;place-items:center;font:800 56px var(--display);background:repeating-linear-gradient(45deg,#efe2c2 0 12px,#f7eed8 12px 24px)}
.ad-bar{height:6px;border-radius:3px;background:var(--parch-2);overflow:hidden}
.ad-bar i{display:block;height:100%;width:0;background:var(--rose);transition:width 3s linear}
#shop{overflow-y:auto;background:linear-gradient(#151032,#0c1d17);gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.shop-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.shop-head h2{margin:0;font:800 30px var(--display)}
.section-label{margin:10px 0 0;font:800 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#a9bfb2}
.item{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;background:var(--parch);color:var(--ink);border-radius:20px;padding:12px}
.item .thumb{width:64px;height:64px;border-radius:16px;background:#2a6b4c;overflow:hidden;display:grid;place-items:center;font-size:30px}
.item .thumb img{width:100%;height:100%;object-fit:cover}
.item h3{margin:0;font:800 19px/1.1 var(--display)}
.item p{margin:2px 0 8px;color:var(--muted);font-size:14px;line-height:1.4}
.item .btn{padding:9px 12px;font-size:16px}
.tag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--rose);color:#fff;font:800 11px var(--body);vertical-align:3px}
.notes{margin:0;padding-left:18px;color:#c9d6cc;font-size:14px;line-height:1.6}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--parch);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:10px 16px;font:700 14px var(--body);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#unlock{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden;background:var(--ubg);padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.u-stage{position:relative;width:180px;height:230px}
.u-gate{position:absolute;inset:0;border-radius:90px 90px 8px 8px;background:radial-gradient(circle at 50% 42%,#fffbe0,#ffd166 28%,#8fd3ff 66%,#2a3b6a);box-shadow:0 0 70px rgba(255,220,140,.65);overflow:hidden;perspective:600px}
.u-gate i{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(#6b4a2a,#3f2a16);border:3px solid #2a1a0c}
.u-gate i.l{left:0;border-radius:90px 0 0 8px;transform-origin:left;animation:doorL 1.3s .7s both}
.u-gate i.r{right:0;border-radius:0 90px 8px 0;transform-origin:right;animation:doorR 1.3s .7s both}
.u-lira{position:absolute;left:50%;bottom:-24px;width:110px;height:157px;margin-left:-55px;animation:walkIn 1.6s 1.8s both}
.u-lira img{width:100%;height:100%;object-fit:contain}
.fog{position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(closest-side,rgba(235,240,245,.96),rgba(235,240,245,0));animation:fogL 1.7s .2s both}
.fog.f2{animation-name:fogR}
.u-title{position:relative;z-index:2;text-align:center;animation:stamp .5s 1.1s both}
.u-title span{font:800 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.u-title h2{margin:2px 0;font:800 40px/1 var(--display)}
.u-title p{margin:0;color:#d5ddd7;max-width:30ch}
#unlock .btn{position:relative;z-index:2;max-width:280px;animation:pop .4s 2.6s both}
@keyframes doorL{to{transform:rotateY(-100deg)}}
@keyframes doorR{to{transform:rotateY(100deg)}}
@keyframes walkIn{from{transform:translateY(60px) scale(1.15)}to{transform:translateY(-70px) scale(.45);opacity:0}}
@keyframes fogL{to{transform:translateX(-90%);opacity:0}}
@keyframes fogR{to{transform:translateX(90%);opacity:0}}
@keyframes stamp{from{transform:scale(2.2);opacity:0}}
.confetti{position:absolute;inset:0;z-index:12;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.card .body{width:110px;height:150px;margin:-6px auto -4px}
.card .body img{display:block;width:100%;height:100%;object-fit:contain}
.dance img{animation:dance .7s ease-in-out infinite}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
.shake{animation:shake .45s 2}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
@keyframes starIn{from{transform:scale(0) rotate(-45deg)}}
@media (prefers-reduced-motion:reduce){.card,.big-stars span,.lira-pin img,.lira-corner .avatar img,.node.current,.spell.ready .orb,.spell.burst .orb::after,.dance img,.shake,.goal.hit,#unlock *{animation:none!important}.ad-bar i{transition:none}}
</style>
</head>
<body>
<div id="app">

  <section id="map" class="screen">

/* ---------- save ---------- */
const DEF={coins:500,lives:5,livesAt:0,stars:[],xp:0,thorn:3,outfit:'forest',outfits:['forest'],starter:false,intro:false,daily:'',dailyAd:'',unlockAll:false,adsPersonal:true,pid:'',sfx:true,music:true,haptics:true};

Sound.set({sfx:save.sfx,music:save.music,haptics:save.haptics});
if(!save.pid){save.pid='LRF-'+Array.from(crypto.getRandomValues(new Uint8Array(4)),b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();persist()}
function load(){try{return Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(localStorage.getItem('lira-rf')||'{}'))}catch(e){return JSON.parse(JSON.stringify(DEF))}}
function persist(){try{localStorage.setItem('lira-rf',JSON.stringify(save))}catch(e){}}
function regenLives(){
  const now=Date.now();
  while(save.lives<MAX_LIVES&&now-save.livesAt>=LIFE_MS){save.lives++;save.livesAt+=LIFE_MS}
  if(save.lives>=MAX_LIVES)save.livesAt=now;
}
function loseLife(){Sound.play('lifeLost');regenLives();if(save.lives>=MAX_LIVES)save.livesAt=Date.now();save.lives=Math.max(0,save.lives-1);persist()}

/* ---------- rune drawing ---------- */
function runePath(g,t,s){
  g.beginPath();
  if(t===0){g.moveTo(0,-s);g.quadraticCurveTo(s*1.1,-s*.1,0,s);g.quadraticCurveTo(-s*1.1,-s*.1,0,-s)}
  else if(t===1){for(let i=0;i<16;i++){const a=i*Math.PI/8-Math.PI/2,rr=i%2?s*.66:s;i?g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):g.moveTo(Math.cos(a)*rr,Math.sin(a)*rr)}}
  else if(t===2){g.moveTo(0,-s);g.bezierCurveTo(s*.95,-s*.05,s*.85,s*.95,0,s*.95);g.bezierCurveTo(-s*.85,s*.95,-s*.95,-s*.05,0,-s)}
  else if(t===3){for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2,px=Math.cos(a)*s*.48,py=Math.sin(a)*s*.48;g.moveTo(px+s*.52,py);g.arc(px,py,s*.52,0,Math.PI*2)}}
  else if(t===4){g.moveTo(0,-s);g.lineTo(s*.82,-s*.28);g.lineTo(s*.48,s*.92);g.lineTo(-s*.48,s*.92);g.lineTo(-s*.82,-s*.28)}
  else{for(let i=0;i<6;i++){const a=i*Math.PI/3;i?g.lineTo(Math.cos(a)*s*.95,Math.sin(a)*s*.95):g.moveTo(Math.cos(a)*s*.95,Math.sin(a)*s*.95)}}
  g.closePath();
}
const RUNE_FILES=['rune-0-leaf','rune-1-sun','rune-2-drop','rune-3-bloom','rune-4-crystal','rune-5-ember'];
const RUNE_IMG=RUNE_FILES.map(n=>{const im=new Image();im.onload=runeArtLoaded;im.src=`art/${n}.png`;return im});
const PRISM_IMG=Object.assign(new Image(),{onload:runeArtLoaded,src:'art/rune-prism.png'});
const MOSS_IMG=Object.assign(new Image(),{onload:runeArtLoaded,src:'art/moss.png'});
const ready=im=>im.complete&&im.naturalWidth>0;
// once the gems arrive, repaint the small canvases that were drawn with the vector fallback
function runeArtLoaded(){const bar=document.getElementById('spellBar');if(bar)bar.dataset.lv='';if(typeof lv!=='undefined'&&lv)renderHUD()}
function drawRune(g,t,x,y,s,sp,time){
  if(sp==='prism'&&ready(PRISM_IMG)){g.save();g.translate(x,y);g.rotate(time*.6);g.drawImage(PRISM_IMG,-s*1.15,-s*1.15,s*2.3,s*2.3);g.restore();return}
  if(t>=0&&ready(RUNE_IMG[t])){
    g.save();g.translate(x,y);
    g.drawImage(RUNE_IMG[t],-s*1.18,-s*1.18,s*2.36,s*2.36);
    if(sp==='h'||sp==='v'){
      g.save();g.beginPath();g.arc(0,0,s*1.02,0,7);g.clip();g.fillStyle='rgba(255,255,255,.7)';
      for(const k of[-1,0,1]){sp==='h'?g.fillRect(-s*1.1,k*s*.42-s*.07,s*2.2,s*.14):g.fillRect(k*s*.42-s*.07,-s*1.1,s*.14,s*2.2)}
      g.restore();g.fillStyle='#fff';
      for(const d of[-1,1]){g.beginPath();if(sp==='h'){g.moveTo(d*s*1.22,0);g.lineTo(d*s*.9,-s*.2);g.lineTo(d*s*.9,s*.2)}else{g.moveTo(0,d*s*1.22);g.lineTo(-s*.2,d*s*.9);g.lineTo(s*.2,d*s*.9)}g.fill()}
    }
    if(sp==='bomb'){g.strokeStyle=`rgba(255,240,170,${.55+.45*Math.sin(time*6)})`;g.lineWidth=s*.16;g.beginPath();g.arc(0,0,s*1.1,0,7);g.stroke()}
    g.restore();return;
  }
  g.save();g.translate(x,y);
  if(sp==='prism'){
    const cg=g.createConicGradient?g.createConicGradient(time*2,0,0):null;
    if(cg){['#ff7a7a','#ffd166','#7ee081','#8fd3ff','#c9a2ff','#ff7a7a'].forEach((c,i)=>cg.addColorStop(i/5,c));g.fillStyle=cg}else g.fillStyle='#e2cbff';
    g.beginPath();g.arc(0,0,s*.92,0,7);g.fill();
    g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.arc(0,0,s*.38,0,7);g.fill();
    g.fillStyle='#fff';g.beginPath();g.ellipse(-s*.3,-s*.42,s*.18,s*.1,-.6,0,7);g.fill();
    g.restore();return;
  }
  const T=TYPES[t];
  g.save();g.translate(0,s*.12);runePath(g,t,s);g.fillStyle='rgba(0,0,0,.28)';g.fill();g.restore();
  const gr=g.createLinearGradient(0,-s,0,s);gr.addColorStop(0,T.c1);gr.addColorStop(1,T.c2);
  runePath(g,t,s);g.fillStyle=gr;g.fill();
  g.lineWidth=Math.max(1,s*.08);g.strokeStyle='rgba(255,255,255,.6)';g.stroke();
  g.fillStyle='rgba(255,255,255,.6)';g.beginPath();g.ellipse(-s*.28,-s*.4,s*.2,s*.1,-.6,0,7);g.fill();
  if(sp==='h'||sp==='v'){
    g.save();runePath(g,t,s);g.clip();g.fillStyle='rgba(255,255,255,.8)';
    for(const k of[-1,0,1]){sp==='h'?g.fillRect(-s,k*s*.42-s*.07,s*2,s*.14):g.fillRect(k*s*.42-s*.07,-s,s*.14,s*2)}
    g.restore();
    g.fillStyle='#fff';
    for(const d of[-1,1]){g.beginPath();if(sp==='h'){g.moveTo(d*s*1.18,0);g.lineTo(d*s*.86,-s*.2);g.lineTo(d*s*.86,s*.2)}else{g.moveTo(0,d*s*1.18);g.lineTo(-s*.2,d*s*.86);g.lineTo(s*.2,d*s*.86)}g.fill()}
  }
  if(sp==='bomb'){
    g.strokeStyle=`rgba(255,240,170,${.55+.45*Math.sin(time*6)})`;g.lineWidth=s*.14;g.beginPath();g.arc(0,0,s*1.06,0,7);g.stroke();
    g.fillStyle='#fff';g.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?s*.12:s*.32;i?g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):g.moveTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.closePath();g.fill();
  }
  g.restore();
}
function drawMoss(g,x,y,S){
  if(typeof MOSS_IMG!=='undefined'&&MOSS_IMG.complete&&MOSS_IMG.naturalWidth){g.drawImage(MOSS_IMG,x-S*.03,y-S*.03,S*1.06,S*1.06);return}
  g.fillStyle='#3f2d16';g.beginPath();g.roundRect(x+2,y+3,S-4,S-4,S*.22);g.fill();
  g.fillStyle='#7a5a30';g.beginPath();g.roundRect(x+2,y+1,S-4,S-6,S*.22);g.fill();
  g.fillStyle='#8fd35f';
  for(let i=0;i<7;i++){const a=(i*2.3+x*.07+y*.11)%6.28,rr=S*(.3+(i%3)*.05);g.beginPath();g.arc(x+S/2+Math.cos(a)*rr,y+S/2+Math.sin(a)*rr,S*.07,0,7);g.fill()}
}
function drawVine(g,x,y,S,time){
  g.save();g.translate(x,y);g.strokeStyle='#3e9b3a';g.lineWidth=S*.08;g.lineCap='round';
  g.beginPath();g.moveTo(-S*.45,-S*.3);g.bezierCurveTo(-S*.1,-S*.55,S*.1,S*.55,S*.45,S*.3);g.stroke();
  g.beginPath();g.moveTo(-S*.45,S*.3);g.bezierCurveTo(-S*.1,S*.55,S*.1,-S*.55,S*.45,-S*.3);g.stroke();
  g.fillStyle='#7ed35f';
  for(const[lx,ly,a]of[[-S*.3,-S*.36,-.6],[S*.3,S*.36,2.5],[S*.28,-S*.34,.6],[-S*.28,S*.36,-2.5]]){g.beginPath();g.ellipse(lx,ly,S*.1,S*.05,a,0,7);g.fill()}
  g.restore();
}
function goalIcon(goal){
  const c=document.createElement('canvas');c.width=60;c.height=60;const g=c.getContext('2d');g.scale(2,2);

function addMana(t){

function findLira(){for(let k=0;k<R*C;k++){const p=grid[Math.floor(k/C)][k%C];if(p&&p.lira)return k}return null}

  let[r,c]=rc(k);const[gr,gc]=lv.gate,d=(a,b)=>Math.abs(a-gr)+Math.abs(b-gc),p=grid[r][c];
  let steps=0;

    let best=null;

      const rr=r+dr,cc=c+dc;
      if(rr<0||rr>=R||cc<0||cc>=C||grid[rr][cc])continue;
      if(d(rr,cc)<d(r,c)&&(!best||d(rr,cc)<d(best[0],best[1])))best=[rr,cc];

  p.lin=true;
  if(r===gr&&c===gc){g.got=1;Sound.play('gate');Sound.haptic('heavy');floatText(W/2,oy+R*S*.4,'Lira reached the gate!',28,'#8fd3ff')}
  else if(steps>1){floatText(cx(c),cy(r)-S*.6,`${steps} steps!`,22,'#8fd3ff');say(`Whee! ${steps} steps at once!`,'happy',true)}

// Lira is fixed in place for gravity: runes above her stack on her, runes below refill by growing in place

  show(gameEl);state='play';buildBoard(def);renderHUD();say(def.tip);resize();
  settle().then(()=>{if(lv&&lv.i===i)lv.busy=false});
}
function renderHUD(){
  if(!lv)return;
  $('#movesN').textContent=lv.moves;$('#movesBox').classList.toggle('low',lv.moves<=5);
  lv.goals.forEach(g=>{if(g.lira)g.dist=liraDist()});
  const row=$('#goalRow');row.innerHTML='';row.append(...goalChips(lv.goals).children);
  renderSpells();
}
function renderSpells(){
  const bar=$('#spellBar');
  bar.hidden=lv.i<FEATURE_AT.spells;if(bar.hidden)return;
  if(bar.dataset.lv!==String(lv.i)){
    bar.dataset.lv=lv.i;
    bar.innerHTML=SPELLS.map(s=>`<button class="spell" data-sp="${s.id}"><span class="orb" style="--col:${TYPES[s.t].c2}"><i><canvas width="56" height="56" data-rune="${s.t}"></canvas></i></span>${s.name}<span class="cnt"></span></button>`).join('')
      +'<button class="spell" data-sp="thorn"><span class="orb" style="--p:0;--col:#7ed35f"><i><span style="font-size:22px;color:#7ed35f" aria-hidden="true">✦</span></i><span class="n"></span></span>Thorn Strike<span class="cnt">booster</span></button>';
    bar.querySelectorAll('canvas[data-rune]').forEach(c=>{const g=c.getContext('2d');g.scale(2,2);drawRune(g,+c.dataset.rune,14,14,10.5,null,0)});
  }
  SPELLS.forEach(s=>{
    const b=bar.querySelector(`[data-sp="${s.id}"]`),have=lv.mana[s.id],p=Math.round(have/s.need*100);
    b.classList.toggle('ready',p>=100);b.classList.toggle('active',castMode===s.id);
    b.querySelector('.orb').style.setProperty('--p',p);b.querySelector('.cnt').textContent=p>=100?'Ready!':`${have}/${s.need}`;
    b.setAttribute('aria-label',`${s.name}, ${have} of ${s.need} ${TYPES[s.t].name} runes`);
  });
  const th=bar.querySelector('[data-sp="thorn"]');th.classList.toggle('active',castMode==='thorn');th.querySelector('.n').textContent=save.thorn;th.setAttribute('aria-label',`Thorn Strike, ${save.thorn} left`);
  if(lv.justCharged){const b=bar.querySelector(`[data-sp="${lv.justCharged}"]`);b.classList.remove('burst');void b.offsetWidth;b.classList.add('burst');lv.justCharged=null}
}
$('#spellBar').addEventListener('click',e=>{const b=e.target.closest('[data-sp]');if(b)pickSpell(b.dataset.sp)});
function buyThorn(inLevel){
  const can=save.coins>=600;
  modal(`<p class="eyebrow">Booster</p><h2>Thorn Strike ×3</h2><p class="muted">Smash any single rune, including ones wrapped in vines. Doesn't use a move.</p>
  <button class="btn" data-act="buy" ${can?'':'disabled'}>${can?'Buy for 600 coins':'Not enough coins'}</button>${can?'':'<button class="btn plain" data-act="shop">Get coins</button>'}<button class="btn ghost" data-act="close">Close</button>`,
  {buy:()=>{save.coins-=600;save.thorn+=3;persist();closeModal();renderHUD();renderTop();toast('+3 Thorn Strikes')},shop:()=>{closeModal();if(inLevel)toast('Finish the level, then visit the shop');else openShop()},close:closeModal});
}
$('#exitBtn').onclick=()=>{
  if(!lv||lv.over)return;
  if(!lv.acted){goMap();return}
  modal(`<h2>Leave the level?</h2><p class="muted">You'll lose a life.</p><button class="btn" data-act="stay">Keep playing</button><button class="btn ghost" data-act="leave">Leave and lose a life</button>`,
    {stay:closeModal,leave:()=>{loseLife();goMap()}});
};
function showAd(cb){
  let n=3;
  modal(`<p class="eyebrow">Sample ad</p><div class="ad-box" id="adN">3</div><p class="muted">A short rewarded video plays here (e.g. AdMob). The player chose to watch it for a reward.</p><div class="ad-bar"><i id="adBar"></i></div>`,{});
  const bar=$('#adBar');bar.offsetWidth;bar.style.width='100%';
  Sound.set({sfx:false,music:false});
  clearInterval(adTimer);adTimer=setInterval(()=>{n--;const el=$('#adN');if(el)el.textContent=Math.max(0,n);if(n<=0){clearInterval(adTimer);Sound.set({sfx:save.sfx,music:save.music});Sound.play('coins',4);cb()}},1000);
}
const wallet=()=>`<div class="wallet"><span><i class="coin"></i>${save.coins.toLocaleString('en-US')} coins</span><button data-act="getcoins">+ Get coins</button></div>`;
// quick coin store shown on top of a level modal; back() reopens that modal with the new balance
function coinStore(back){
  const packs=['c1000','c5500'].map(k=>`<button class="btn" data-act="${k}">${IAP[k].name} · ${IAP[k].price} (demo)</button>`).join('');
  modal(`<p class="eyebrow">Get coins</p><h2>Coin pouch</h2>${wallet().replace(/<button.*?<\/button>/,'')}<p class="muted">Demo purchase. No money is charged.</p>${packs}
  <button class="btn plain" data-act="ad"><span class="ad-tag">AD</span>+100 coins</button><button class="btn ghost" data-act="back">Back</button>`,{
    c1000:()=>{IAP.c1000.grant();persist();Sound.play('purchase');toast('+2,500 coins');back()},
    c5500:()=>{IAP.c5500.grant();persist();Sound.play('purchase');toast('+14,000 coins');back()},
    ad:()=>showAd(()=>{save.coins+=100;persist();toast('+100 coins');back()}),
    back:()=>back(),
  });
}
function outOfMoves(){
  state='paused';Sound.urgent(false);
  const can=save.coins>=300;
  const close=lv.goals.every(g=>g.lira?(g.got||g.dist<=2):g.need-g.got<=Math.max(2,Math.ceil(g.need*.2)));
  const ready=lv.i>=FEATURE_AT.spells&&SPELLS.some(s=>lv.mana[s.id]>=s.need);
  modal(`<p class="eyebrow">Level ${lv.i+1}</p><h2>Out of moves!</h2>${wallet()}<p class="muted">${close?'So close! Still needed:':'Still needed:'}</p><div class="goal-list" id="leftGoals"></div>
  <button class="btn" data-act="buy" ${can?'':'disabled'}>${can?'+5 moves · 300 coins':'+5 moves · not enough coins'}</button>
  ${ready?'<button class="btn green" data-act="spell">Cast my charged spell first</button>':''}
  ${lv.adUsed?'':'<button class="btn plain" data-act="ad"><span class="ad-tag">AD</span>+3 moves</button>'}
  <button class="btn ghost" data-act="quit">Give up</button>`,{
    buy:()=>{save.coins-=300;persist();lv.moves+=5;resume()},
    spell:()=>{closeModal();state='play';say('Pick a spell below and cast it!')},
    ad:()=>showAd(()=>{lv.adUsed=true;lv.moves+=3;resume()}),
    quit:()=>{loseLife();failLevel()},
    getcoins:()=>coinStore(outOfMoves),
  });
  $('#leftGoals').append(...goalChips(lv.goals.filter(g=>g.got<g.need)).children);
}
function resume(){closeModal();state='play';Sound.play('moves',5);renderHUD();say("Let's finish this!",'happy')}
function failLevel(){
  if(!lv.over){Sound.play('fail');Sound.haptic('warning')}
  lv.over=true;state='paused';
  const none=save.lives<=0,canRefill=save.coins>=900;
  modal(`<div class="body" aria-hidden="true">${liraBodySVG(save.outfit,'sad')}</div><h2>Level failed</h2>${wallet()}<div class="goal-list shake" id="failGoals"></div><p class="muted">The runes will wait for us. Lives left: ${save.lives}.</p>
  ${none?`<button class="btn" data-act="refill" ${canRefill?'':'disabled'}>${canRefill?'Refill lives · 900 coins':'Refill lives · need 900 coins'}</button>`:''}
  <button class="btn green" data-act="retry" ${save.lives>0?'':'disabled'}>Try again</button><button class="btn ghost" data-act="map">Back to map</button>`,
  {retry:()=>{const i=lv.i;levelIntro(i)},map:()=>goMap(),
   refill:()=>{save.coins-=900;save.lives=MAX_LIVES;persist();Sound.play('lifeRefill');toast('Lives refilled');failLevel()},
   getcoins:()=>coinStore(failLevel)});
  $('#failGoals').append(...goalChips(lv.goals.filter(g=>g.lira?!g.got:g.got<g.need)).children);
}
async function winLevel(){
  lv.over=true;lv.busy=true;const left=lv.moves;
  say('We did it! The forest is glowing again!','happy');
  if(left>0){
    floatText(W/2,oy+R*S*.45,'Forest Bloom!',36,'#9ff0c0');await wait(500);
    const cand=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++){const p=grid[r][c];if(p&&!p.sp&&p.t>=0)cand.push(idx(r,c))}
    cand.sort(()=>Math.random()-.5);
    const set=new Set(cand.slice(0,Math.min(left,8)));
    set.forEach(k=>{const[r,c]=rc(k);grid[r][c].sp=Math.random()<.5?'h':'v'});
    lv.score+=left*250;renderHUD();await wait(400);
    await explode(set,new Map(),1);await resolve(null);
  }
  const stars=1+(left>=Math.ceil(lv.def.moves*.15)?1:0)+(left>=Math.ceil(lv.def.moves*.3)?1:0);
  const coins=30+left*10,xp=stars*20,before=liraLevel(),firstClear=!save.stars[lv.i];
  save.stars[lv.i]=Math.max(save.stars[lv.i]||0,stars);save.coins+=coins;save.xp+=xp;
  const levelUp=liraLevel()>before;if(levelUp)save.thorn+=1;
  persist();state='paused';Sound.urgent(false);Sound.play('win');Sound.haptic('success');
  [0,1,2].forEach(k=>{if(k<stars)setTimeout(()=>Sound.play('star',k),1300+k*200)});setTimeout(()=>Sound.play('coins',8),2000);
  const next=lv.i+1<LEVELS.length,i=lv.i,newWorld=firstClear&&next&&LEVELS[i+1].w!==lv.def.w;
  const show=doubled=>{modal(`<div class="body dance" aria-hidden="true">${liraBodySVG(save.outfit,'cheer')}</div><p class="eyebrow">${LOOKS[lv.def.ch].name} · Level ${i+1}</p><h2>Level complete!</h2>
  <div class="big-stars">${[0,1,2].map(k=>`<span class="${k<stars?'':'off'}" style="animation-delay:${.2+k*.2}s">★</span>`).join('')}</div>
  <p class="muted">${left} moves to spare</p>
  <div class="rewards"><span>+<b id="coinCount">0</b> coins${doubled?' (doubled)':''}</span><span>+${xp} XP</span></div>
  ${doubled?'':`<button class="btn plain" data-act="dbl"><span class="ad-tag">AD</span>Double to +${coins*2} coins</button>`}
  ${levelUp?`<p class="muted"><b>Lira reached Lv ${liraLevel()}!</b> +1 Thorn Strike</p>`:''}
  ${newWorld?`<p class="muted">A new gate opens: <b>${WORLDS[LEVELS[i+1].w].name}</b></p>`:''}
  ${next?'':'<p class="muted">You finished every level in this prototype.</p>'}
  <button class="btn green" data-act="next">Continue</button>`,
  {next:()=>goMap({hop:firstClear?i:null,then:next?i+1:null,newWorld}),dbl:()=>showAd(()=>{save.coins+=coins;persist();show(true)})});
  countUp($('#coinCount'),doubled?coins*2:coins)};
  show(false);confetti();
}
function noLives(i){
  const can=save.coins>=900;
  modal(`<h2>Out of lives</h2><p class="muted">A life refills every 20 minutes.</p>
  <button class="btn" data-act="buy" ${can?'':'disabled'}>${can?'Refill all lives · 900 coins':'Refill · not enough coins'}</button>
  <button class="btn plain" data-act="ad"><span class="ad-tag">AD</span>+1 life</button><button class="btn ghost" data-act="close">Wait</button>`,{
    buy:()=>{save.coins-=900;save.lives=MAX_LIVES;persist();renderTop();levelIntro(i)},
    ad:()=>showAd(()=>{save.lives++;persist();renderTop();levelIntro(i)}),
    close:closeModal,
  });
}
function goMap(opts){
  clearInterval(adTimer);closeModal();lv=null;state='map';Sound.urgent(false);Sound.music('map');show(mapEl);renderMap();
  const o=opts&&opts.then!==undefined?opts:{},pin=$('#liraPin');
  if(pin)pin.scrollIntoView({block:'center'});
  const after=()=>{if(o.then==null)return;if(o.newWorld)showUnlock(LEVELS[o.then].w,()=>levelIntro(o.then));else setTimeout(()=>levelIntro(o.then),300)};
  const from=o.hop!=null&&$(`.node[data-i="${o.hop}"]`);
  if(pin&&from&&!calm){
    const fr=from.getBoundingClientRect(),pr=pin.getBoundingClientRect(),dx=fr.left+fr.width/2-(pr.left+pr.width/2),dy=fr.top-pr.bottom;
    Sound.play('hop');setTimeout(()=>Sound.play('unlockNode'),950);
    const a=pin.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:`translate(${dx/2}px,${dy/2-60}px)`},{transform:'translate(0,0)'}],{duration:900,easing:'ease-in-out'});
    a.onfinish=after;
  }else after();
}
function showUnlock(wi,cb){
  const w=WORLDS[wi],el=$('#unlock');
  el.style.setProperty('--ubg',`linear-gradient(rgba(20,40,60,.1),rgba(20,40,60,.35)),url(${LOOKS[LEVELS.find(l=>l.w===wi).ch].img}) center/cover,${w.bg}`);
  el.innerHTML=`<div class="u-stage"><div class="u-gate"><i class="l"></i><i class="r"></i></div><div class="u-lira">${liraBodySVG(save.outfit,'walk')}</div></div><div class="fog"></div><div class="fog f2"></div><div class="u-title"><span>New world unlocked</span><h2>${w.name}</h2><p>${w.blurb}</p></div><button class="btn green" id="unlockGo">Let's explore</button>`;
  el.hidden=false;Sound.music(null);Sound.play('reveal');setTimeout(()=>Sound.play('fanfare'),700);
  $('#unlockGo').onclick=()=>{el.hidden=true;if(cb)cb()};
}
function confetti(){
  Sound.play('confetti');
  if(calm)return;
  const box=document.createElement('div'),cols=['#ffd166','#ff9fc6','#8fd3ff','#9ff0c0','#c9a2ff'];box.className='confetti';
  for(let i=0;i<46;i++){const c=document.createElement('i');c.style.left=Math.random()*100+'%';c.style.background=cols[i%5];c.style.animationDelay=(Math.random()*.6).toFixed(2)+'s';c.style.animationDuration=(2+Math.random()*1.4).toFixed(2)+'s';box.appendChild(c)}
  $('#app').appendChild(box);setTimeout(()=>box.remove(),4300);
}
function countUp(el,to){if(!el)return;if(calm){el.textContent=to;return}const t0=performance.now(),tick=n=>{const k=Math.min(1,(n-t0)/900);el.textContent=Math.round(to*k);if(k<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)}

/* ---------- shop ---------- */
const IAP={
  starter:{name:'Starter Pack',price:'$0.99',grant:()=>{save.coins+=1500;save.thorn+=3;if(!save.outfits.includes('moon'))save.outfits.push('moon');save.starter=true}},
  c1000:{name:'Pouch of Coins',price:'$1.99',grant:()=>{save.coins+=2500}},
  c5500:{name:'Chest of Coins',price:'$7.99',grant:()=>{save.coins+=14000}},
};
function openShop(){state='shop';Sound.music('shop');show(shopEl);shopEl.scrollTop=0;renderShop()}
function renderShop(){
  renderTop();
  const item=(thumb,title,desc,btn)=>`<div class="item"><div class="thumb">${thumb}</div><div><h3>${title}</h3><p>${desc}</p>${btn}</div></div>`;
  $('#coinList').innerHTML=
    (save.starter?'':item(liraSVG('moon'),'Starter Pack<span class="tag">One time</span>','1,500 coins, 3 Thorn Strikes and the Moonlight Cloak for Lira.','<button class="btn" data-iap="starter">$0.99 · demo</button>'))+
    item('<span style="color:#ffd166">●</span>','Pouch of Coins','2,500 coins.','<button class="btn" data-iap="c1000">$1.99 · demo</button>')+
    item('<span style="color:#ffd166">●●</span>','Chest of Coins<span class="tag">Best value</span>','14,000 coins.','<button class="btn" data-iap="c5500">$7.99 · demo</button>');
  $('#boostList').innerHTML=
    item('<span style="color:#7ed35f">✦</span>',`Thorn Strike ×3 <small style="font:700 13px var(--body);color:var(--muted)">(you have ${save.thorn})</small>`,'Smash any single rune. Doesn\'t use a move.','<button class="btn" data-coin="thorn">600 coins</button>')+
    item('<span style="color:#ff7a8a">♥</span>','Refill lives','Back to 5 lives right away.',`<button class="btn" data-coin="lives" ${save.lives>=MAX_LIVES?'disabled':''}>${save.lives>=MAX_LIVES?'Lives are full':'900 coins'}</button>`);
  $('#devList').innerHTML=item('<span style="color:#8fd3ff">⚙</span>','Unlock all levels','For testing: play any level without finishing the one before it.',`<button class="btn plain" data-dev="unlock">${save.unlockAll?'On · tap to lock again':'Off · tap to unlock'}</button>`);
  const sw=(k,label)=>`<button class="btn plain" data-set="${k}">${save[k]?'On · tap to turn off':'Off · tap to turn on'}</button>`;
  $('#setList').innerHTML=
    item('<span style="color:#ffd166">♪</span>','Music','Background music on the map and in levels.',sw('music'))+
    item('<span style="color:#8fd3ff">♫</span>','Sound effects','Rune pops, spells, coins and buttons.',sw('sfx'))+
    item('<span style="color:#9ff0c0">≋</span>','Vibration','A little buzz when runes match and spells land.',sw('haptics'));
  $('#privList').innerHTML=
    item('<span style="color:#8fd3ff">◎</span>','Personalised ads','Let ads be picked for you based on how you use apps. Off means you still see ads, just less tailored.',`<button class="btn plain" data-priv="ads">${save.adsPersonal?'On · tap to turn off':'Off · tap to turn on'}</button>`)+
    item('<span style="color:#8fd3ff">#</span>','Your player ID',`<b style="font-family:monospace;letter-spacing:1px">${save.pid}</b><br>Send this ID with any privacy request so we can find your data.`,'<button class="btn plain" data-priv="copy">Copy ID</button>')+
    item('<span style="color:#ffd166">↺</span>','Restore purchases','Got a new phone? Get back the things you bought.','<button class="btn plain" data-priv="restore">Restore</button>')+
    item('<span style="color:#8fd3ff">§</span>','Privacy policy','What the game collects and your choices.','<button class="btn plain" data-priv="policy">Read policy</button>');
  $('#outfitList').innerHTML=Object.entries(OUTFITS).map(([id,o])=>{
    let btn;
    if(save.outfit===id)btn='<button class="btn plain" disabled>Wearing</button>';
    else if(save.outfits.includes(id))btn=`<button class="btn plain" data-wear="${id}">Wear</button>`;
    else if(id==='moon')btn='<button class="btn plain" disabled>In the Starter Pack</button>';
    else btn=`<button class="btn" data-outfit="${id}">3,000 coins</button>`;
    return item(liraSVG(id),o.name,'Cosmetic only.',btn);

shopEl.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.set){const k=b.dataset.set;save[k]=!save[k];persist();Sound.set({sfx:save.sfx,music:save.music,haptics:save.haptics});renderShop();if(k==='haptics'&&save.haptics)Sound.haptic('medium');return}
  if(b.dataset.priv){const k=b.dataset.priv;
    if(k==='ads'){save.adsPersonal=!save.adsPersonal;persist();renderShop();toast(save.adsPersonal?'Personalised ads on':'Personalised ads off')}
    else if(k==='copy'){(navigator.clipboard?navigator.clipboard.writeText(save.pid):Promise.reject()).then(()=>toast('Player ID copied'),()=>toast('Your ID: '+save.pid))}
    else if(k==='restore')toast('Purchases are up to date (demo)');
    else if(k==='policy')window.open('https://nerlybit2.github.io/lira-privacy/','_blank');
    return}
  if(b.dataset.dev){save.unlockAll=!save.unlockAll;persist();renderShop();toast(save.unlockAll?'All levels unlocked':'Levels locked again');return}
  if(b.dataset.iap){const it=IAP[b.dataset.iap];
    modal(`<p class="eyebrow">Demo purchase</p><h2>${it.name}</h2><p class="big-stars" style="font-size:34px;color:var(--ink)">${it.price}</p><p class="muted">In the real game this goes through the App Store or Google Play. This is a demo; no money is charged.</p><button class="btn" data-act="ok">Confirm (demo)</button><button class="btn ghost" data-act="no">Cancel</button>`,
      {ok:()=>{it.grant();persist();Sound.play('purchase');Sound.haptic('success');closeModal();renderShop();paintAvatars();toast('Purchase complete')},no:closeModal});}
  else if(b.dataset.coin==='thorn')buyThorn(false);
  else if(b.dataset.coin==='lives'){if(save.coins<900){toast(`You need ${900-save.coins} more coins`);return}save.coins-=900;save.lives=MAX_LIVES;persist();renderShop();toast('Lives refilled')}
  else if(b.dataset.wear){save.outfit=b.dataset.wear;persist();renderShop();paintAvatars();toast(`Lira is wearing the ${OUTFITS[save.outfit].name}`)}
  else if(b.dataset.outfit){if(save.coins<3000){toast(`You need ${(3000-save.coins).toLocaleString('en-US')} more coins`);return}save.coins-=3000;save.outfits.push(b.dataset.outfit);save.outfit=b.dataset.outfit;persist();renderShop();paintAvatars();toast('New outfit unlocked!')}
});
$('#shopBtn').onclick=openShop;
$('#shopBack').onclick=()=>goMap();

// every button gives a soft click; back/close style buttons click lower
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;Sound.play(b.classList.contains('ghost')||b.id==='shopBack'||b.id==='exitBtn'?'back':'tap');Sound.haptic('select')},true);

// settings: music, sound effects and vibration, reachable from the map and from inside a level
function openSettings(){
  const was=state;if(state==='play')state='paused';
  const row=(k,label,sub)=>`<div class="toggle-row"><span>${label}<small>${sub}</small></span><button class="switch" role="switch" aria-checked="${save[k]}" aria-label="${label}" data-act="t_${k}"></button></div>`;
  const draw=()=>modal(`<p class="eyebrow">Settings</p><h2>Sound</h2>
    ${row('music','Music','Background music')}${row('sfx','Sound effects','Runes, spells, coins, buttons')}${row('haptics','Vibration','Buzz on matches and spells')}
    <button class="btn green" data-act="done" style="margin-top:16px">Done</button>`,{
      t_music:()=>flip('music'),t_sfx:()=>flip('sfx'),t_haptics:()=>flip('haptics'),
      done:()=>{closeModal();if(was==='play'&&lv&&!lv.over)state='play'},
    });
  const flip=k=>{save[k]=!save[k];persist();Sound.set({sfx:save.sfx,music:save.music,haptics:save.haptics});if(k==='haptics'&&save.haptics)Sound.haptic('medium');draw()};
  draw();
}
$('#setBtn').onclick=openSettings;$('#setBtnGame').onclick=openSettings;

/* ---------- boot ---------- */
refreshLiraImg();goMap();
if(!save.intro){
  modal(`<div class="body" aria-hidden="true">${liraBodySVG(save.outfit,'cheer')}</div><p class="eyebrow">Rune Forest</p><h2>Hi, I'm Lira!</h2><p class="muted">The Heartrune shattered, and without its magic the forest is falling asleep. Help me gather the runes, gate by gate, and wake the worlds beyond.</p><button class="btn green" data-act="go">Let's go</button>`,
    {go:()=>{save.intro=true;persist();closeModal()}});
}
